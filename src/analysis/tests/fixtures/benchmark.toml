# Benchmark used by the tests of the benchmark plot: small-7x7 and random
# sets of 3 patterns for N = 64 and 128, dense weights up to N = 64 and
# factored weights, both learning rules, 2 repeats.
# Regenerate from src/compute:
#   cargo run --release -- benchmark --config ../analysis/tests/fixtures/benchmark.toml --out ../analysis/tests/fixtures/benchmark --force

seed = 1
datasets = ["small-7x7"]
repeats = 2
backends = ["dense", "factored"]
dense_limit = 64
noise = 0.1

[random]
neurons = [64, 128]
patterns = 3

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"
