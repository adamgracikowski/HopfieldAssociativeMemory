# Recall run used by the tests: small-7x7, Hebbian learning, pattern 2 with
# 14 flipped pixels, asynchronous updates with a frame every 7 updates.
# Regenerate from src/compute:
#   cargo run --release -- recall --config ../analysis/tests/fixtures/recall.toml --out ../analysis/tests/fixtures/recall --force

dataset = "small-7x7"
seed = 2

[learning]
rule = "hebb"

[dynamics]
mode = "asynchronous"
record_every = 7

[input]
source = "pattern"
index = 2
flips = 14
