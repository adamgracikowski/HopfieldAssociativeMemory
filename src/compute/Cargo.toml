[package]
name = "compute"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Hopfield associative memory network built from scratch for the Artificial Intelligence Methods course. Features Hebbian and Oja's learning rules for pattern recognition. Includes synchronous/asynchronous modes and step-by-step bitmap visualization."

[lib]
name = "compute"
path = "src/lib.rs"

[[bin]]
name = "compute"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
miette = { version = "7.6.0", features = ["fancy"] }
ndarray = "0.17.2"
npyz = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
