# Time and memory of training and recall against N (dense weights up to
# N = 16384, 2 GiB).
#
#   cargo run --release -- benchmark --config ../../data/experiments/benchmark/config.toml
#   uv run hopfield-analysis benchmark ../../data/experiments/benchmark/results --out ../../data/experiments/benchmark/figures/benchmark

seed = 20261113
datasets = ["cats-300x200-median", "cats-300x200-dither"]
repeats = 5
backends = ["dense", "factored"]
dense_limit = 16384
noise = 0.1

[random]
neurons = [1024, 2048, 4096, 8192, 16384, 32768, 60000]
patterns = 12

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"
