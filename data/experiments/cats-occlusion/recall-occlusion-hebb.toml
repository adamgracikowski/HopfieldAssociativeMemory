# Cat 8 with 100 of the 200 rows covered, Hebbian rule: ends in a spurious
# state nearest pattern 10 (overlap 0.66).
#
#   cargo run --release -- recall --config ../../data/experiments/cats-occlusion/recall-occlusion-hebb.toml --out ../../data/experiments/cats-occlusion/runs/recall-occlusion-hebb
#   uv run hopfield-analysis frames ../../data/experiments/cats-occlusion/runs/recall-occlusion-hebb --max 5 --width 0.8 --out ../../data/experiments/cats-occlusion/figures/recall-occlusion-hebb
#   uv run hopfield-analysis animate ../../data/experiments/cats-occlusion/runs/recall-occlusion-hebb --scale 2 --duration 150 --hold 2000 --out ../../data/experiments/cats-occlusion/figures/recall-occlusion-hebb.gif
#   uv run hopfield-analysis view ../../data/experiments/cats-occlusion/runs/recall-occlusion-hebb --frame 20 --out ../../data/experiments/cats-occlusion/figures/viewer-occlusion-hebb

dataset = "cats-300x200-median"
seed = 20261113

[learning]
rule = "hebb"

[dynamics]
mode = "asynchronous"
record_every = 6000

[input]
source = "occlusion"
index = 8
rows = 100
