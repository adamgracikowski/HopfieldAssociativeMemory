# Recall of a cat photo from an occluded input: pattern 8 of
# cats-300x200-median with a band of 100 of the 200 rows at a random
# position set to -1, trained with Oja's subspace rule, asynchronous updates
# with a frame every 6000 of the 60000 updates of a sweep. The same seed
# gives the same input for both rules; the state ends in pattern 8.
#
# Run from src/compute:
#   cargo run --release -- recall --config ../../data/experiments/cats-occlusion/recall-occlusion-oja.toml --out ../../data/experiments/cats-occlusion/runs/recall-occlusion-oja
# Report figure, from src/analysis:
#   uv run hopfield-analysis frames ../../data/experiments/cats-occlusion/runs/recall-occlusion-oja --max 5 --width 0.8 --out ../../data/experiments/cats-occlusion/figures/recall-occlusion-oja
# README animation, from src/analysis:
#   uv run hopfield-analysis animate ../../data/experiments/cats-occlusion/runs/recall-occlusion-oja --scale 2 --duration 150 --hold 2000 --out ../../data/experiments/cats-occlusion/figures/recall-occlusion-oja.gif

dataset = "cats-300x200-median"
seed = 20261113

[learning]
rule = "oja"

[dynamics]
mode = "asynchronous"
record_every = 6000

[input]
source = "occlusion"
index = 8
rows = 100
