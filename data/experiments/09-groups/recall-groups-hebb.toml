# Recall in a set of groups of similar patterns: variant 0 of the first
# group of groups-25x25-d05 (picture 0 of large-25x25 with 5% of the
# pixels flipped) trained with the Hebbian rule, given without noise,
# synchronous updates. No variant is a fixed point; the state moves to one
# spurious state shared by the whole group.
#
# Run from src/compute:
#   cargo run --release -- recall --config ../../data/experiments/09-groups/recall-groups-hebb.toml --out ../../data/experiments/09-groups/runs/recall-groups-hebb
# Report figure, from src/analysis:
#   uv run hopfield-analysis frames ../../data/experiments/09-groups/runs/recall-groups-hebb --out ../../data/experiments/09-groups/figures/recall-groups-hebb

dataset = "groups-25x25-d05"
seed = 20261110

[learning]
rule = "hebb"

[dynamics]
mode = "synchronous"

[input]
source = "pattern"
index = 0
flips = 0
