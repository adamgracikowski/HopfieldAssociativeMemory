# Random inputs against p at a fixed N (dataset prefixes); the same initial
# states in every prefix.
#
#   cargo run --release -- experiment --config ../../data/experiments/random-load/config.toml
#   uv run hopfield-analysis distinct ../../data/experiments/random-load/results --out ../../data/experiments/random-load/figures/distinct

seed = 20261112
datasets = [
    { name = "large-25x25.plus", patterns = 3 },
    { name = "large-25x25.plus", patterns = 6 },
    { name = "large-25x25.plus", patterns = 9 },
    { name = "large-25x25.plus", patterns = 12 },
    "large-25x25.plus",
    { name = "letters-14x20", patterns = 2 },
    { name = "letters-14x20", patterns = 5 },
    { name = "letters-14x20", patterns = 10 },
    { name = "letters-14x20", patterns = 15 },
    { name = "letters-14x20", patterns = 20 },
    "letters-14x20",
]
trials = 10000
attractors = true

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"

[dynamics]
modes = ["synchronous", "asynchronous"]

[input]
source = "random"
