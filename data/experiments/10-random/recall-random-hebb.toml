# Recall from a random input: run 2 of letters-abc-8x12 in 10-random (seed
# from attractors.parquet), trained with the Hebbian rule, asynchronous
# updates with a frame every 8 of the 96 updates of a sweep. The same seed
# gives the same input for both rules. The state ends in the mixture of the
# three letters with positive signs, a spurious state with a lower energy
# than the letters.
#
# Run from src/compute:
#   cargo run --release -- recall --config ../../data/experiments/10-random/recall-random-hebb.toml --out ../../data/experiments/10-random/runs/recall-random-hebb
# Report figure, from src/analysis:
#   uv run hopfield-analysis frames ../../data/experiments/10-random/runs/recall-random-hebb --max 5 --width 0.75 --out ../../data/experiments/10-random/figures/recall-random-hebb

dataset = "letters-abc-8x12"
seed = 191849100212383786

[learning]
rule = "hebb"

[dynamics]
mode = "asynchronous"
record_every = 8

[input]
source = "random"
