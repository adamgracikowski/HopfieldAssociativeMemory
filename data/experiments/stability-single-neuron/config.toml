# Stability with Oja's single-neuron rule, which learns only the first principal
# component; plotted by the `stable` command of stability/config.toml.
#
#   cargo run --release -- experiment --config ../../data/experiments/stability-single-neuron/config.toml

seed = 20261106
datasets = [
    "small-7x7",
    "letters-abc-8x12",
    "animals-14x9",
    "letters-14x20",
    "OCRA-12x30-cut",
    "large-25x25",
    "large-25x25.plus",
    "large-25x50",
]
trials = 20
stability_fields = true

[[learning]]
rule = "oja"
variant = "single-neuron"

[dynamics]
modes = ["synchronous", "asynchronous"]
max_steps = 100

[input]
source = "pattern"
noise = [0.0]
