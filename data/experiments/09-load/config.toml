# Recovery against the number of stored patterns at a fixed N: prefixes of
# large-25x25.plus (N = 625) and letters-14x20 (N = 280). A target gets the
# same damaged input in every prefix (seeds use the registry name).
#
# Run from src/compute:
#   cargo run --release -- experiment --config ../../data/experiments/09-load/config.toml

seed = 20261110
datasets = [
    { name = "large-25x25.plus", patterns = 3 },
    { name = "large-25x25.plus", patterns = 6 },
    { name = "large-25x25.plus", patterns = 9 },
    { name = "large-25x25.plus", patterns = 12 },
    "large-25x25.plus",
    { name = "letters-14x20", patterns = 2 },
    { name = "letters-14x20", patterns = 5 },
    { name = "letters-14x20", patterns = 10 },
    { name = "letters-14x20", patterns = 15 },
    { name = "letters-14x20", patterns = 20 },
    "letters-14x20",
]
trials = 100

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"

[dynamics]
modes = ["synchronous", "asynchronous"]

[input]
source = "pattern"
noise = [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
