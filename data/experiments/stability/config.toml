# Stability of the stored patterns.
#
#   cargo run --release -- experiment --config ../../data/experiments/stability/config.toml
#   uv run hopfield-analysis stable ../../data/experiments/stability/results ../../data/experiments/stability-single-neuron/results --out ../../data/experiments/stability/figures/stable
#   uv run hopfield-analysis fields ../../data/experiments/stability/results --log --out ../../data/experiments/stability/figures/fields
#   uv run hopfield-analysis overlaps ../../data/experiments/stability/results --datasets large-25x25,large-25x50 --out ../../data/experiments/stability/figures/overlaps-large
#   uv run hopfield-analysis unstable ../../data/experiments/stability/results --dataset large-25x50 --learning hebb --out ../../data/experiments/stability/figures/unstable-large-25x50
#   uv run hopfield-analysis unstable ../../data/experiments/stability/results --dataset letters-14x20 --learning hebb --columns 9 --out ../../data/experiments/stability/figures/unstable-letters-14x20
#   uv run hopfield-analysis patterns small-7x7 --columns 5 --width 0.3 --numbers --out ../../data/experiments/stability/figures/patterns-small-7x7
#   uv run hopfield-analysis patterns letters-abc-8x12 --columns 3 --width 0.2 --numbers --out ../../data/experiments/stability/figures/patterns-letters-abc-8x12
#   uv run hopfield-analysis patterns animals-14x9 --columns 6 --width 0.46 --numbers --out ../../data/experiments/stability/figures/patterns-animals-14x9
#   uv run hopfield-analysis patterns OCRA-12x30-cut --columns 7 --width 0.45 --numbers --out ../../data/experiments/stability/figures/patterns-OCRA-12x30-cut
#   uv run hopfield-analysis patterns large-25x50 --columns 6 --width 0.53 --numbers --out ../../data/experiments/stability/figures/patterns-large-25x50
#   uv run hopfield-analysis patterns letters-14x20 --columns 13 --width 1 --numbers --out ../../data/experiments/stability/figures/patterns-letters-14x20
#   uv run hopfield-analysis patterns large-25x25.plus --columns 15 --width 1 --numbers --out ../../data/experiments/stability/figures/patterns-large-25x25.plus

seed = 20261106
datasets = [
    "small-7x7",
    "letters-abc-8x12",
    "animals-14x9",
    "letters-14x20",
    "OCRA-12x30-cut",
    "large-25x25",
    "large-25x25.plus",
    "large-25x50",
]
trials = 20
stability_fields = true

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"

[dynamics]
modes = ["synchronous", "asynchronous"]

[input]
source = "pattern"
noise = [0.0]
