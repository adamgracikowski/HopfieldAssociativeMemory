# Run 2 of letters-abc-8x12 in the random experiment (seed from
# attractors.parquet), Hebbian rule: ends in the mixture sign(a + b + c), a
# spurious state with a lower energy than the letters.
#
#   cargo run --release -- recall --config ../../data/experiments/random/recall-random-hebb.toml --out ../../data/experiments/random/runs/recall-random-hebb
#   uv run hopfield-analysis frames ../../data/experiments/random/runs/recall-random-hebb --max 5 --width 0.75 --out ../../data/experiments/random/figures/recall-random-hebb

dataset = "letters-abc-8x12"
seed = 191849100212383786

[learning]
rule = "hebb"

[dynamics]
mode = "asynchronous"
record_every = 8

[input]
source = "random"
