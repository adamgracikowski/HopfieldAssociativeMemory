# Random inputs (every pixel 1 or -1 with probability 1/2); every rule and mode
# starts from the same states.
#
#   cargo run --release -- experiment --config ../../data/experiments/random/config.toml
#   uv run hopfield-analysis outcomes ../../data/experiments/random/results --out ../../data/experiments/random/figures/outcomes
#   uv run hopfield-analysis accessibility ../../data/experiments/random/results --datasets small-7x7,animals-14x9,large-25x25,large-25x50 --out ../../data/experiments/random/figures/accessibility
#   uv run hopfield-analysis energies ../../data/experiments/random/results --datasets small-7x7,animals-14x9,large-25x25,large-25x50 --out ../../data/experiments/random/figures/energies
#   uv run hopfield-analysis attractors ../../data/experiments/random/results --dataset letters-abc-8x12 --out ../../data/experiments/random/figures/attractors-letters-abc-8x12
#   uv run hopfield-analysis attractors ../../data/experiments/random/results --dataset large-25x25.plus --out ../../data/experiments/random/figures/attractors-large-25x25.plus

seed = 20261112
datasets = [
    "small-7x7",
    "letters-abc-8x12",
    "animals-14x9",
    "letters-14x20",
    "OCRA-12x30-cut",
    "large-25x25",
    "large-25x25.plus",
    "large-25x50",
]
trials = 10000
attractors = true

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"

[dynamics]
modes = ["synchronous", "asynchronous"]

[input]
source = "random"
