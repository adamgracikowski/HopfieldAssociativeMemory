# Recovery from a band of round(f H) rows covered with -1; the levels give
# distinct row counts down to H = 7.
#
#   cargo run --release -- experiment --config ../../data/experiments/occlusion/config.toml
#   uv run hopfield-analysis recovery ../../data/experiments/occlusion/results --out ../../data/experiments/occlusion/figures/recovery

seed = 20261110
datasets = [
    "small-7x7",
    "letters-abc-8x12",
    "animals-14x9",
    "letters-14x20",
    "OCRA-12x30-cut",
    "large-25x25",
    "large-25x25.plus",
    "large-25x50",
]
trials = 100

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"

[dynamics]
modes = ["synchronous", "asynchronous"]

[input]
source = "occlusion"
occlusion = [0.0, 0.15, 0.3, 0.45, 0.6, 0.75]
