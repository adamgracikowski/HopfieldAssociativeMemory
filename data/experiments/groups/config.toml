# Groups of similar patterns against a diverse set of the same size
# (N = 625, p = 15): three pictures of large-25x25 with five variants each,
# 2%, 5%, 10% or 20% of the pixels flipped (data/generated/groups-25x25),
# and the 15 different pictures of large-25x25.plus.
#
# Run from src/compute:
#   cargo run --release -- experiment --config ../../data/experiments/groups/config.toml
# Report figures, from src/analysis:
#   uv run hopfield-analysis recovery ../../data/experiments/groups/results --out ../../data/experiments/groups/figures/recovery
#   uv run hopfield-analysis patterns groups-25x25-d05 --columns 15 --numbers --out ../../data/experiments/groups/figures/patterns-d05

seed = 20261110
datasets = [
    "groups-25x25-d02",
    "groups-25x25-d05",
    "groups-25x25-d10",
    "groups-25x25-d20",
    "large-25x25.plus",
]
trials = 100

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"

[dynamics]
modes = ["synchronous", "asynchronous"]

[input]
source = "pattern"
noise = [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
