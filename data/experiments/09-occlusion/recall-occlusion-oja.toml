# Recall from an occluded input: pattern 0 of large-25x25 with a band of
# round(0.3 * 25) = 8 rows at a random position set to -1, trained with
# the Oja's subspace rule, synchronous updates. The same seed gives the same input
# for both rules.
#
# Run from src/compute:
#   cargo run --release -- recall --config ../../data/experiments/09-occlusion/recall-occlusion-oja.toml --out ../../data/experiments/09-occlusion/runs/recall-occlusion-oja
# Report figure, from src/analysis:
#   uv run hopfield-analysis frames ../../data/experiments/09-occlusion/runs/recall-occlusion-oja --out ../../data/experiments/09-occlusion/figures/recall-occlusion-oja

dataset = "large-25x25"
seed = 20261110

[learning]
rule = "oja"

[dynamics]
mode = "synchronous"

[input]
source = "occlusion"
index = 0
rows = 8
