# Stability of the stored patterns: every CSV dataset trained with the
# Hebbian rule and Oja's subspace rule, each stored pattern given as the
# input in both update modes, with the aligned fields written.
#
# Run from src/compute:
#   cargo run --release -- experiment --config ../../data/experiments/08-stability/config.toml
# Report figures, from src/analysis (the bars also show Oja's single-neuron
# rule from 08-stability-single-neuron):
#   uv run hopfield-analysis stable ../../data/experiments/08-stability/results ../../data/experiments/08-stability-single-neuron/results --out ../../data/experiments/08-stability/figures/stable
#   uv run hopfield-analysis fields ../../data/experiments/08-stability/results --log --out ../../data/experiments/08-stability/figures/fields
#   uv run hopfield-analysis overlaps ../../data/experiments/08-stability/results --datasets large-25x25,large-25x50 --out ../../data/experiments/08-stability/figures/overlaps-large
#   uv run hopfield-analysis unstable ../../data/experiments/08-stability/results --dataset large-25x50 --learning hebb --out ../../data/experiments/08-stability/figures/unstable-large-25x50
#   uv run hopfield-analysis unstable ../../data/experiments/08-stability/results --dataset letters-14x20 --learning hebb --columns 9 --out ../../data/experiments/08-stability/figures/unstable-letters-14x20
# Patterns of the datasets (large-25x25 is the first six patterns of
# large-25x25.plus), one figure per dataset with the given number of columns
# and width (fraction of the text width), panels of one report figure:
#   for spec in small-7x7:5:0.3 letters-abc-8x12:3:0.2 animals-14x9:6:0.46 OCRA-12x30-cut:7:0.45 large-25x50:6:0.53 letters-14x20:13:1 large-25x25.plus:15:1; do IFS=: read name columns width <<< "$spec"; uv run hopfield-analysis patterns $name --columns $columns --width $width --numbers --out ../../data/experiments/08-stability/figures/patterns-$name; done

seed = 20261106
datasets = [
    "small-7x7",
    "letters-abc-8x12",
    "animals-14x9",
    "letters-14x20",
    "OCRA-12x30-cut",
    "large-25x25",
    "large-25x25.plus",
    "large-25x50",
]
trials = 20
stability_fields = true

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"

[dynamics]
modes = ["synchronous", "asynchronous"]

[input]
source = "pattern"
noise = [0.0]
