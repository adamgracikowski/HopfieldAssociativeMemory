# The checkerboard has overlap 1/25 with every shape, so its Hebbian fields
# h = (1/25) sum_mu xi^mu - (4/25) x are opposite to x: a cycle of length 2.
#
#   cargo run --release -- recall --config ../../data/experiments/cycle/recall-cycle.toml --out ../../data/experiments/cycle/runs/recall-cycle
#   uv run hopfield-analysis patterns cycle-5x5 --width 0.6 --out ../../data/experiments/cycle/figures/patterns
#   uv run hopfield-analysis frames ../../data/experiments/cycle/runs/recall-cycle --width 0.3 --out ../../data/experiments/cycle/figures/frames

dataset = "cycle-5x5"
seed = 20261113

[learning]
rule = "hebb"

[dynamics]
mode = "synchronous"

[input]
source = "file"
path = "checkerboard.npy"
