# Recovery of the cat photos (300x200 bitmaps, N = 60000, factored weights)
# from noisy inputs: both cat datasets, both learning rules and update
# modes, round(f N) flipped pixels for f from 0 to 0.5 in steps of 0.05,
# with the aligned fields of every stored pattern in stability.parquet.
#
# Run from src/compute:
#   cargo run --release -- experiment --config ../../data/experiments/cats-noise/config.toml
# Report figures, from src/analysis:
#   uv run hopfield-analysis patterns cats-300x200-median --columns 4 --out ../../data/experiments/cats-noise/figures/patterns-median
#   uv run hopfield-analysis unstable ../../data/experiments/cats-noise/results --dataset cats-300x200-median --learning hebb --columns 4 --out ../../data/experiments/cats-noise/figures/unstable-median-hebb
#   uv run hopfield-analysis fields ../../data/experiments/cats-noise/results --log --out ../../data/experiments/cats-noise/figures/fields
#   uv run hopfield-analysis recovery ../../data/experiments/cats-noise/results --out ../../data/experiments/cats-noise/figures/recovery

seed = 20261113
datasets = ["cats-300x200-median", "cats-300x200-dither"]
trials = 100
stability_fields = true

[[learning]]
rule = "hebb"

[[learning]]
rule = "oja"

[dynamics]
modes = ["synchronous", "asynchronous"]

[input]
source = "pattern"
noise = [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
